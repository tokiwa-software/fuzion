version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: monthly
    groups:
      codeql:
        patterns:
          - "github/codeql-action/*"
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: monthly
    ignore:
      - dependency-name: eclipse-temurin
        update-types: [ "version-update:semver-major" ]
